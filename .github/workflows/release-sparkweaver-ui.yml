name: Release sparkweaver_ui

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Select the semantic version bump type"
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Releases are only allowed from the main branch."
            exit 1
          fi

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate next version and update pubspec
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          bump = os.environ["BUMP_TYPE"]
          output_path = Path(os.environ["GITHUB_OUTPUT"])
          pubspec_path = Path("sparkweaver_ui/pubspec.yaml")

          current_file = pubspec_path.read_text(encoding="utf-8")

          latest_tag = ""
          file_version_match = re.search(r"^version:\s*(\d+\.\d+\.\d+)\s*$", current_file, flags=re.MULTILINE)
          if not file_version_match:
              raise ValueError("Could not find a simple semantic version in sparkweaver_ui/pubspec.yaml")
          file_version = file_version_match.group(1)

          def parse_version(version: str):
              match = re.match(r"^(\d+)\.(\d+)\.(\d+)$", version)
              if not match:
                  raise ValueError(f"Unsupported version format: {version}")
              return tuple(map(int, match.groups()))

          result = subprocess.run(
              ["git", "tag", "--list", "v*.*.*", "--sort=-v:refname"],
              capture_output=True,
              text=True,
              check=True,
          )
          tags = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          if tags:
              latest_tag = tags[0]
              tag_version = latest_tag.lstrip("v")
              base_version = max(parse_version(tag_version), parse_version(file_version))
          else:
              base_version = parse_version(file_version)

          major, minor, patch = base_version

          if bump == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump == "minor":
              minor += 1
              patch = 0
          elif bump == "patch":
              patch += 1
          else:
              raise ValueError(f"Unsupported bump type: {bump}")

          next_version = f"{major}.{minor}.{patch}"
          next_tag = f"v{next_version}"

          def write_version(path: Path, text: str) -> None:
              path.write_text(
                  re.sub(
                      r"^version:\s*\d+\.\d+\.\d+\s*$",
                      f"version: {next_version}",
                      text,
                      count=1,
                      flags=re.MULTILINE,
                  ),
                  encoding="utf-8",
              )

          write_version(pubspec_path, current_file)

          # The widgetbook ships the library's components, so it carries the
          # same version rather than drifting on its own.
          widgetbook_path = Path("sparkweaver_widgetbook/pubspec.yaml")
          write_version(widgetbook_path, widgetbook_path.read_text(encoding="utf-8"))

          with output_path.open("a", encoding="utf-8") as out:
              out.write(f"latest_tag={latest_tag}\n")
              out.write(f"version={next_version}\n")
              out.write(f"tag={next_tag}\n")
          PY

      - name: Commit version bump
        run: |
          git add sparkweaver_ui/pubspec.yaml sparkweaver_widgetbook/pubspec.yaml
          git commit -m "chore(release): bump sparkweaver_ui to ${{ steps.version.outputs.tag }}"

      - name: Create git tag
        run: git tag ${{ steps.version.outputs.tag }}

      - name: Push commit and tag
        run: |
          git push origin HEAD
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
